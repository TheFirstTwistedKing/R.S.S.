name: Windows EXE 빌드

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: EXE 빌드 (설치형 + 포터블)
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 빌드 결과 보관 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: RSS-windows-${{ steps.ver.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: GitHub Releases 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: R.S.S. v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: dist/*.exe
          body: |
            ## 다운로드
            - **RSS-Setup-${{ steps.ver.outputs.version }}.exe** — 설치형 (바탕화면·시작 메뉴 아이콘 생성)
            - **RSS-Portable-${{ steps.ver.outputs.version }}.exe** — 설치 없이 바로 실행

            코드 서명이 없어 처음 실행할 때 Windows SmartScreen 경고가 뜰 수 있습니다. **추가 정보 → 실행**을 누르면 됩니다.
