name: Windows EXE 빌드

# PR: 빌드만 확인 / main 병합: 빌드 후 Releases 업로드
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'mobile/**', 'android-app/**', '.github/workflows/android-apk.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # 저장소 이름이 점(.)으로 끝나 Windows 기본 작업 폴더를 만들 수 없으므로 C:\rss 에서 빌드
    defaults:
      run:
        working-directory: C:\rss
    steps:
      - name: 소스 받기
        working-directory: C:\
        shell: bash
        run: |
          git init -q /c/rss
          cd /c/rss
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout -q FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 의존성 설치
        run: npm ci

      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: EXE 빌드 (설치형 + 포터블)
        run: npx electron-builder --win nsis portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 빌드 결과 보관 (Actions 아티팩트)
        uses: actions/upload-artifact@v4
        with:
          name: RSS-windows-${{ steps.ver.outputs.version }}
          path: C:\rss\dist\*.exe
          if-no-files-found: error

      - name: GitHub Releases 업로드
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: R.S.S. v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: C:/rss/dist/*.exe
          body: |
            ## 다운로드
            - **RSS-Setup.exe** — 설치형 (바탕화면·시작 메뉴 아이콘 생성)
            - **RSS-Portable.exe** — 설치 없이 바로 실행

            코드 서명이 없어 처음 실행할 때 Windows SmartScreen 경고가 뜰 수 있습니다. **추가 정보 → 실행**을 누르면 됩니다.
