name: 모바일 웹앱 배포 (GitHub Pages)

# main 에 mobile/ 이 바뀌어 병합되면 휴대폰용 R.S.S. Mobile 을 GitHub Pages 에 올림
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'index.html', '.github/workflows/pages-mobile.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages 설정 (처음이면 켜기)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # 저장소 폴더 구조와 같게: /mobile/ = 앱, / = 앱으로 이동하는 안내 페이지
      # (Pages 가 브랜치 자동 빌드로 배포되어도 같은 주소가 나오도록)
      - name: 올릴 파일 모으기
        run: |
          mkdir -p _site
          cp -r mobile _site/mobile
          cp index.html _site/index.html
      - name: 모바일 앱 파일 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: 배포
        id: dep
        uses: actions/deploy-pages@v4
