name: 안드로이드 APK 빌드

# mobile/(웹앱) 또는 android-app/ 이 바뀌면 R.S.S. Mobile APK 를 만듦
# PR: 빌드만 확인 / main 병합: Releases 의 'mobile' 항목에 RSS-Mobile.apk 업로드 (항상 같은 주소)
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'android-app/**', 'apps/shared/update.js', 'build/icon.png', '.github/workflows/android-apk.yml']
  pull_request:
    branches: [main]
    paths: ['mobile/**', 'android-app/**', 'apps/shared/update.js', 'build/icon.png', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor 설치
        run: npm ci
      - name: 버전 읽기
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 안드로이드 프로젝트 준비 (아이콘 · 시작 화면 · 세로 고정 · 버전)
        run: bash prepare.sh ${{ github.run_number }}
      - name: APK 빌드
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: 파일 이름 정리 · 서명 키 확인 (android-app/debug.keystore 와 같아야 함)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk RSS-Mobile.apk
          want=$(keytool -list -v -keystore debug.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile RSS-Mobile.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "key $want / apk $got"
          test "$want" = "$got"
      - uses: actions/upload-artifact@v4
        with:
          name: RSS-Mobile-apk
          path: android-app/RSS-Mobile.apk
          if-no-files-found: error
      - name: Releases 업로드
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile
          name: R.S.S. Mobile v${{ steps.ver.outputs.v }} (Android)
          target_commitish: ${{ github.sha }}
          make_latest: false
          overwrite_files: true
          files: android-app/RSS-Mobile.apk
          body: |
            ## R.S.S. Mobile 안드로이드 앱
            - **RSS-Mobile.apk** 를 휴대폰에서 받아 설치합니다.
            - 처음 설치할 때 "출처를 알 수 없는 앱 설치 허용" 을 켜야 합니다 (Play 스토어 앱이 아니므로).
            - 새 버전이 나오면 같은 주소에서 받아 그대로 덮어 설치하면 지갑 · 기록이 유지됩니다.
            - 투자 · 지갑은 시뮬레이션이며 R.S.S. 컴퓨터 앱에는 영향이 없습니다.
