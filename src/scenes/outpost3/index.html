<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outpost 3</title>
<style>
  @font-face { font-family: 'D2Coding'; src: url('../../fonts/D2Coding.woff2') format('woff2'); }
  html, body { margin: 0; height: 100%; background: #dfe6ef; overflow: hidden; }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .tag {
    position: fixed; left: 16px; bottom: 16px; padding: 8px 12px;
    font: 12px/1.5 'D2Coding', monospace; letter-spacing: .08em; color: #1d222b;
    background: rgba(243, 246, 251, .78); border-left: 3px solid #b5452c; pointer-events: none;
  }
  .tag b { display: block; font-size: 11px; letter-spacing: .2em; color: #b5452c; }
  #fps { position: fixed; right: 16px; bottom: 16px; font: 11px/1 'D2Coding', monospace; color: #4b5563; pointer-events: none; }
  @media (max-width: 560px) { .tag { font-size: 11px; left: 12px; right: 12px; bottom: 12px; } #fps { top: 12px; right: 12px; bottom: auto; } }

  /* ── 감시 영상(feed) 모드: 로봇 머리 카메라 HUD ── */
  #hud { display: none; }
  body.cctv { background: #050505; }
  body.cctv #stage, body.cctv .tag, body.cctv #fps { display: none; }
  /* CCTV 격자: 3 × 3 칸, 한 칸을 누르면 그 칸만 크게 */
  #grid { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 4px; padding: 4px; background: #050505; }
  #grid.one { grid-template-columns: 1fr; grid-template-rows: 1fr; padding: 0; }
  #grid.one .tile:not(.on) { display: none; }
  .tile { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #0b0c0e; outline: 1px solid #23262c; cursor: pointer; }
  .tile canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tile.off canvas { image-rendering: pixelated; }
  .tile:hover { outline-color: #ffb020; }
  #grid.one .tile { outline: 0; }
  .t-hud { position: absolute; inset: 0; pointer-events: none; font: 10px/1 'D2Coding', monospace; letter-spacing: .12em; color: rgba(236, 242, 250, .9); text-shadow: 0 1px 2px rgba(0, 0, 0, .9); }
  .t-hud > span { position: absolute; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .t-code { top: 7px; left: 8px; padding: 3px 6px; background: rgba(8, 10, 14, .6); letter-spacing: .06em; }
  .t-code b { color: #ffb020; font-weight: 700; letter-spacing: .12em; }
  .t-rec { top: 7px; right: 8px; padding: 3px 6px; background: rgba(8, 10, 14, .6); }
  .t-rec i { width: 7px; height: 7px; border-radius: 50%; background: #e0412b; animation: rec 2s ease-in-out infinite; }
  @keyframes rec { 50% { opacity: .4; } }
  .tile.off .t-rec { color: #8c8a84; }
  .t-time { bottom: 7px; right: 8px; padding: 3px 6px; background: rgba(8, 10, 14, .6); }
  .t-ns { inset: 0; flex-direction: column; justify-content: center; gap: 6px; font-size: 10px; color: rgba(243, 232, 210, .75); }
  .t-ns b { font: 700 clamp(14px, 2.4vw, 40px)/1 'D2Coding', monospace; letter-spacing: .18em; color: #f3e8d2; background: rgba(5, 5, 5, .55); padding: 6px 12px; }
  #grid.one .t-hud { font-size: 12px; }
  #grid.one .t-code { top: 14px; left: 16px; } #grid.one .t-rec { top: 14px; right: 16px; } #grid.one .t-time { bottom: 14px; right: 16px; }
  @media (max-width: 600px) { #grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: none; grid-auto-rows: calc((100vw - 12px) / 2 * 9 / 16); overflow-y: auto; } #grid.one { grid-template-columns: 1fr; grid-auto-rows: auto; grid-template-rows: 1fr; } .t-time { display: none; } }
  /* 순찰 로봇(A-001)을 크게 볼 때만 머리 카메라 정보 */
  body.fpv #hud { z-index: 5;
    display: block; position: fixed; inset: 0; pointer-events: none;
    font: 11px/1 'D2Coding', monospace; letter-spacing: .14em; color: rgba(236, 242, 250, .82);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .9), 0 0 8px rgba(0, 0, 0, .6);
  }
  /* 방위 눈금 (위 가운데) */
  .tape { position: absolute; top: 12px; background: rgba(8, 10, 14, .38); padding-top: 2px; left: 50%; width: min(360px, 52vw); height: 26px; transform: translateX(-50%); overflow: hidden;
          -webkit-mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  .tape-in { position: absolute; top: 0; left: 0; height: 100%; white-space: nowrap; will-change: transform; }
  .tape-in span { position: absolute; top: 0; width: 40px; margin-left: -20px; text-align: center; font-size: 10px; }
  .tape-in span::after { content: ''; display: block; width: 1px; height: 6px; margin: 4px auto 0; background: currentColor; opacity: .7; }
  .tape-mark { position: absolute; top: 40px; left: 50%; width: 0; height: 0; margin-left: -5px; border: 5px solid transparent; border-bottom-color: #ffb020; }
  .hdg { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); color: #ffb020; letter-spacing: .2em; padding: 3px 6px; background: rgba(8, 10, 14, .55); }
  .unit { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: .3em; opacity: .85; white-space: nowrap; }
  /* 조준 표시 (가운데) */
  .ret { position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; }
  .ret i { position: absolute; background: rgba(236, 242, 250, .85); box-shadow: 0 0 2px rgba(0, 0, 0, .8); }
  .ret i:nth-child(1) { left: 0; top: 31px; width: 20px; height: 1px; }
  .ret i:nth-child(2) { right: 0; top: 31px; width: 20px; height: 1px; }
  .ret i:nth-child(3) { top: 0; left: 31px; width: 1px; height: 14px; }
  .ret i:nth-child(4) { left: 30px; top: 30px; width: 3px; height: 3px; background: #ffb020; }
  /* 녹화 정보 (아래 가운데) */
  .tele { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; white-space: nowrap; padding: 6px 12px; background: rgba(8, 10, 14, .55); }
  .tele b { font-weight: 400; color: #ffb020; }
  @media (max-width: 860px) { .tele { gap: 10px; font-size: 10px; } .tele .opt { display: none; } }
  @media (max-width: 560px) { .unit { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="tag"><b>CAM A-001</b>순찰 구역 전경</div>
<div id="fps"></div>
<div id="hud" aria-hidden="true">
  <div class="tape"><div class="tape-in"></div></div>
  <div class="tape-mark"></div>
  <div class="hdg">000°</div>
  <div class="unit">CAM A-001 · PATROL UNIT MK-03</div>
  <div class="ret"><i></i><i></i><i></i><i></i></div>
  <div class="tele">
    <span>TC <b class="tc">00:00:00:00</b></span>
    <span>SPD <b class="spd">0.0</b> km/h</span>
    <span class="opt">GRID <b class="grid">+000 / +000</b></span>
    <span class="opt">ELV <b class="elv">0.0</b> m</span>
  </div>
</div>
<script src="../../vendor/three/three.min.js"></script>
<script src="../../vendor/three/OrbitControls.js"></script>
<script src="../../vendor/three/OutlineEffect.js"></script>
<script src="../../vendor/three/BufferGeometryUtils.js"></script>
<script src="../../vendor/three/CopyShader.js"></script>
<script src="../../vendor/three/LuminosityHighPassShader.js"></script>
<script src="../../vendor/three/EffectComposer.js"></script>
<script src="../../vendor/three/ShaderPass.js"></script>
<script src="../../vendor/three/UnrealBloomPass.js"></script>
<script src="../../vendor/three/GLTFLoader.js"></script>
<script src="../../js/cursor-bridge.js"></script>
<script src="feedhud.js"></script>
<script src="scene.js"></script>
<script src="cctv.js"></script>
<script src="mech.glb.js"></script>
<script src="mech.js"></script>
</body>
</html>
